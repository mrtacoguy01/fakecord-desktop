name: Release

on:
    push:
        branches:
            - main
        tags:
            - v*
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, ubuntu-latest, windows-latest]
                include:
                    - os: macos-latest
                      platform: mac
                    - os: ubuntu-latest
                      platform: linux
                    - os: windows-latest
                      platform: windows

        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2

            - name: Install system dependencies
              if: ${{ matrix.platform == 'linux' }}
              run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev

            - name: Install dependencies
              run: bun install

            - name: Build
              run: bun run build

            - name: Run Electron Builder
              if: ${{ matrix.platform != 'mac' }}
              run: |
                  bun run electron-builder --${{ matrix.platform }} --publish always
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Run Electron Builder (macOS)
              if: ${{ matrix.platform == 'mac' }}
              run: |
                  if [ -n "${{ secrets.APPLE_SIGNING_CERT }}" ]; then
                      export CSC_LINK="${{ secrets.APPLE_SIGNING_CERT }}"
                      export CSC_KEY_PASSWORD="${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}"
                  else
                      export CSC_IDENTITY_AUTO_DISCOVERY=false
                  fi
                  if [ -n "${{ secrets.APPLE_API_KEY }}" ]; then
                      echo "${{ secrets.APPLE_API_KEY }}" > apple.p8
                      export APPLE_API_KEY=apple.p8
                      export APPLE_API_KEY_ID="${{ secrets.APPLE_API_KEY_ID }}"
                      export APPLE_API_ISSUER="${{ secrets.APPLE_API_ISSUER }}"
                  fi
                  bun run electron-builder --mac --publish always
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.platform }}-build
                  path: |
                      dist/*.exe
                      dist/*.AppImage
                      dist/*.deb
                      dist/*.rpm
                      dist/*.tar.gz
                      dist/*.dmg
                      dist/*.zip
                  if-no-files-found: ignore
